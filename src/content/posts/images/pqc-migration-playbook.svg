<svg xmlns="http://www.w3.org/2000/svg" width="740" height="1830" viewBox="0 0 740 1830" role="img" aria-labelledby="title desc">
  <title id="title">An engineering playbook for post-quantum migration</title>
  <desc id="desc">Nine suggested activities for a post-quantum migration: discover, inventory, classify, abstract, version, introduce, migrate, observe, and retire. The sequence is a planning aid; real migrations may loop and overlap.</desc>
  <rect width="740" height="1830" rx="28" fill="#f5f4ef"/>
  <text x="48" y="72" fill="#17301c" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="1.5">ENGINEERING NOTES · MIGRATION MODEL</text>
  <text x="48" y="132" fill="#17301c" font-family="Arial,sans-serif" font-size="38" font-weight="700">Discover, migrate, retire</text>
  <text x="48" y="174" fill="#536257" font-family="Arial,sans-serif" font-size="24">A planning sequence with feedback loops.</text>
  <path d="M108 258v1340" fill="none" stroke="#aebdaa" stroke-width="5"/>
  <g font-family="Arial,sans-serif">
    <rect x="48" y="218" width="644" height="142" rx="16" fill="#fff" stroke="#c9d1c7" stroke-width="2"/><circle cx="108" cy="289" r="34" fill="#17301c"/><text x="108" y="299" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">1</text><text x="166" y="276" fill="#17301c" font-size="30" font-weight="700">DISCOVER</text><text x="166" y="318" fill="#536257" font-size="23">Find direct and indirect cryptographic use.</text>
    <rect x="48" y="390" width="644" height="142" rx="16" fill="#fff" stroke="#c9d1c7" stroke-width="2"/><circle cx="108" cy="461" r="34" fill="#17301c"/><text x="108" y="471" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">2</text><text x="166" y="448" fill="#17301c" font-size="30" font-weight="700">INVENTORY</text><text x="166" y="490" fill="#536257" font-size="23">Record purpose, owner, and dependencies.</text>
    <rect x="48" y="562" width="644" height="142" rx="16" fill="#fff" stroke="#c9d1c7" stroke-width="2"/><circle cx="108" cy="633" r="34" fill="#17301c"/><text x="108" y="643" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">3</text><text x="166" y="620" fill="#17301c" font-size="30" font-weight="700">CLASSIFY</text><text x="166" y="662" fill="#536257" font-size="23">Prioritize by risk and data lifetime.</text>
    <rect x="48" y="734" width="644" height="142" rx="16" fill="#fff" stroke="#c9d1c7" stroke-width="2"/><circle cx="108" cy="805" r="34" fill="#17301c"/><text x="108" y="815" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">4</text><text x="166" y="792" fill="#17301c" font-size="30" font-weight="700">ABSTRACT</text><text x="166" y="834" fill="#536257" font-size="23">Create semantic crypto boundaries.</text>
    <rect x="48" y="906" width="644" height="142" rx="16" fill="#fff" stroke="#c9d1c7" stroke-width="2"/><circle cx="108" cy="977" r="34" fill="#17301c"/><text x="108" y="987" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">5</text><text x="166" y="964" fill="#17301c" font-size="30" font-weight="700">VERSION</text><text x="166" y="1006" fill="#536257" font-size="23">Define authenticated, versioned data formats.</text>
    <rect x="48" y="1078" width="644" height="142" rx="16" fill="#fff" stroke="#c9d1c7" stroke-width="2"/><circle cx="108" cy="1149" r="34" fill="#527257"/><text x="108" y="1159" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">6</text><text x="166" y="1136" fill="#17301c" font-size="30" font-weight="700">INTRODUCE</text><text x="166" y="1178" fill="#536257" font-size="23">Deploy support and test interoperability.</text>
    <rect x="48" y="1250" width="644" height="142" rx="16" fill="#fff" stroke="#c9d1c7" stroke-width="2"/><circle cx="108" cy="1321" r="34" fill="#527257"/><text x="108" y="1331" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">7</text><text x="166" y="1308" fill="#17301c" font-size="30" font-weight="700">MIGRATE</text><text x="166" y="1350" fill="#536257" font-size="23">Move writes and stored data under a plan.</text>
    <rect x="48" y="1422" width="644" height="142" rx="16" fill="#fff" stroke="#c9d1c7" stroke-width="2"/><circle cx="108" cy="1493" r="34" fill="#527257"/><text x="108" y="1503" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">8</text><text x="166" y="1480" fill="#17301c" font-size="30" font-weight="700">OBSERVE</text><text x="166" y="1522" fill="#536257" font-size="23">Measure legacy use without logging secrets.</text>
    <rect x="48" y="1594" width="644" height="142" rx="16" fill="#eaf0e8" stroke="#b8c7b5" stroke-width="2"/><circle cx="108" cy="1665" r="34" fill="#527257"/><text x="108" y="1675" fill="#fff" text-anchor="middle" font-size="27" font-weight="700">9</text><text x="166" y="1652" fill="#17301c" font-size="30" font-weight="700">RETIRE</text><text x="166" y="1694" fill="#536257" font-size="23">Remove old paths when policy allows.</text>
  </g>
  <text x="48" y="1788" fill="#536257" font-family="Arial,sans-serif" font-size="20">Stages can overlap, repeat, or pause as needed.</text>
</svg>
