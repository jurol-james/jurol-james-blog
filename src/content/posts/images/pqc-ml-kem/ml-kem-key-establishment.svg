<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">How ML-KEM establishes shared key material</title>
  <desc id="desc">A recipient generates an encapsulation key and private decapsulation key. A sender encapsulates to the public key and sends only the KEM ciphertext. Both sides obtain matching shared secret material, which a protocol key schedule uses for symmetric authenticated encryption.</desc>
  <rect width="1200" height="820" rx="28" fill="#f5f4ef"/>
  <text x="64" y="68" fill="#17301c" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">ENGINEERING NOTES · POST-QUANTUM CRYPTOGRAPHY</text>
  <text x="64" y="124" fill="#17301c" font-family="Arial,sans-serif" font-size="38" font-weight="700">How ML-KEM establishes shared key material</text>
  <rect x="64" y="165" width="1072" height="135" rx="18" fill="#fff" stroke="#c9d1c7" stroke-width="2"/>
  <circle cx="112" cy="215" r="24" fill="#e7eee5"/><text x="112" y="223" text-anchor="middle" fill="#17301c" font-family="Arial,sans-serif" font-size="22" font-weight="700">1</text>
  <text x="156" y="213" fill="#17301c" font-family="Arial,sans-serif" font-size="24" font-weight="700">Recipient runs ML-KEM.KeyGen()</text>
  <text x="156" y="253" fill="#536257" font-family="Arial,sans-serif" font-size="20">Publishes encapsulation key ek</text>
  <text x="730" y="253" fill="#536257" font-family="Arial,sans-serif" font-size="20">Keeps decapsulation key dk secret</text>
  <rect x="64" y="325" width="470" height="190" rx="18" fill="#fff" stroke="#c9d1c7" stroke-width="2"/>
  <circle cx="112" cy="375" r="24" fill="#e7eee5"/><text x="112" y="383" text-anchor="middle" fill="#17301c" font-family="Arial,sans-serif" font-size="22" font-weight="700">2</text>
  <text x="156" y="373" fill="#17301c" font-family="Arial,sans-serif" font-size="24" font-weight="700">Sender: Encaps(ek)</text>
  <rect x="104" y="405" width="190" height="72" rx="12" fill="#edf2eb"/>
  <text x="199" y="434" text-anchor="middle" fill="#17301c" font-family="Arial,sans-serif" font-size="18" font-weight="700">shared secret Kₛ</text>
  <text x="199" y="460" text-anchor="middle" fill="#536257" font-family="Arial,sans-serif" font-size="15">stays with sender</text>
  <rect x="324" y="405" width="210" height="72" rx="12" fill="#f8f0e6"/>
  <text x="429" y="434" text-anchor="middle" fill="#6d4d2d" font-family="Arial,sans-serif" font-size="18" font-weight="700">KEM ciphertext c</text>
  <text x="429" y="460" text-anchor="middle" fill="#715f4c" font-family="Arial,sans-serif" font-size="15">the value transmitted</text>
  <rect x="666" y="325" width="470" height="190" rx="18" fill="#fff" stroke="#c9d1c7" stroke-width="2"/>
  <circle cx="714" cy="375" r="24" fill="#e7eee5"/><text x="714" y="383" text-anchor="middle" fill="#17301c" font-family="Arial,sans-serif" font-size="22" font-weight="700">3</text>
  <text x="758" y="373" fill="#17301c" font-family="Arial,sans-serif" font-size="24" font-weight="700">Recipient: Decaps(dk, c)</text>
  <rect x="762" y="405" width="360" height="72" rx="12" fill="#edf2eb"/>
  <text x="942" y="434" text-anchor="middle" fill="#17301c" font-family="Arial,sans-serif" font-size="18" font-weight="700">matching shared secret Kᵣ</text>
  <text x="942" y="460" text-anchor="middle" fill="#536257" font-family="Arial,sans-serif" font-size="15">derived using private dk and c</text>
  <path d="M535 494h116" stroke="#9a7046" stroke-width="4"/><path d="m639 484 14 10-14 10" fill="none" stroke="#9a7046" stroke-width="4"/>
  <text x="593" y="478" text-anchor="middle" fill="#715f4c" font-family="Arial,sans-serif" font-size="15">send c only</text>
  <rect x="64" y="555" width="1072" height="190" rx="18" fill="#eaf0e8" stroke="#aebdaa" stroke-width="2"/>
  <text x="600" y="600" text-anchor="middle" fill="#17301c" font-family="Arial,sans-serif" font-size="24" font-weight="700">Kₛ = Kᵣ (for a valid exchange, with overwhelming probability)</text>
  <rect x="112" y="630" width="300" height="74" rx="12" fill="#fff"/>
  <text x="262" y="660" text-anchor="middle" fill="#17301c" font-family="Arial,sans-serif" font-size="18" font-weight="700">protocol key schedule</text>
  <text x="262" y="686" text-anchor="middle" fill="#536257" font-family="Arial,sans-serif" font-size="15">context-bound key material</text>
  <path d="M430 667h104" stroke="#527257" stroke-width="4"/><path d="m522 657 14 10-14 10" fill="none" stroke="#527257" stroke-width="4"/>
  <rect x="552" y="630" width="462" height="74" rx="12" fill="#fff"/>
  <text x="783" y="660" text-anchor="middle" fill="#17301c" font-family="Arial,sans-serif" font-size="18" font-weight="700">symmetric AEAD protects application data</text>
  <text x="783" y="686" text-anchor="middle" fill="#536257" font-family="Arial,sans-serif" font-size="15">for example, AES-GCM in a reviewed protocol</text>
  <text x="64" y="785" fill="#536257" font-family="Arial,sans-serif" font-size="17">The shared secret is never sent. The KEM ciphertext is not the application’s encrypted payload.</text>
</svg>
