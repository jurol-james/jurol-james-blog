    Exact message bytes + signature
  </text>
  <text
    x="1115"
    y="537"
    text-anchor="middle"
    fill="#536257"
    font-family="Arial,sans-serif"
    font-size="22"
  >
    same bytes that the signer signed
  </text>
  <path d="M1115 562v48" stroke="#527257" stroke-width="6" />
  <path
    d="m1100 592 15 22 15-22"
    fill="none"
    stroke="#527257"
    stroke-width="6"
  />
  <rect x="970" y="625" width="290" height="82" rx="16" fill="#17301c" />
  <text
    x="1115"
    y="678"
    text-anchor="middle"
    fill="#fff"
    font-family="Arial,sans-serif"
    font-size="30"
    font-weight="700"
  >
    ML-DSA VERIFY
  </text>
  <path d="M1115 710v45" stroke="#527257" stroke-width="6" />
  <path
    d="m1100 738 15 22 15-22"
    fill="none"
    stroke="#527257"
    stroke-width="6"
  />
  <rect
    x="970"
    y="772"
    width="290"
    height="60"
    rx="14"
    fill="#fff"
    stroke="#b8c7b5"
    stroke-width="3"
  />
  <text
    x="1115"
    y="812"
    text-anchor="middle"
    fill="#17301c"
    font-family="Arial,sans-serif"
    font-size="27"
    font-weight="700"
