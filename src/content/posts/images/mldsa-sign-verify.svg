  </text>
  <text
    x="750"
    y="925"
    text-anchor="middle"
    fill="#17301c"
    font-family="Arial,sans-serif"
    font-size="25"
    font-weight="700"
  >
    A valid result relates these exact bytes to a key; trust in the key comes
    from elsewhere.
  </text>
