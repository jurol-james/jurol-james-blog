<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1500"
  height="980"
  viewBox="0 0 1500 980"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">How ML-DSA signing and verification work</title>
  <desc id="desc">
    The signer feeds exact message bytes and a protected private key into a
    signing operation and sends the resulting signature with the message. A
    verifier uses the same exact message bytes, signature, and trusted public
    key to get a valid or invalid result.
  </desc>
  <rect width="1500" height="980" fill="#f5f4ef" />
  <text
    x="70"
    y="82"
    fill="#17301c"
    font-family="Arial,sans-serif"
    font-size="25"
    font-weight="700"
    letter-spacing="2"
  >
    SIGNATURE FLOW · ML-DSA
  </text>
  <text
    x="70"
    y="150"
    fill="#17301c"
    font-family="Arial,sans-serif"
    font-size="50"
    font-weight="700"
  >
    Signing is not encryption
  </text>
  <rect
    x="65"
    y="210"
    width="640"
    height="650"
    rx="28"
    fill="#f3e9dc"
    stroke="#d9c2a8"
    stroke-width="4"
  />
  <rect
    x="795"
    y="210"
    width="640"
    height="650"
    rx="28"
    fill="#eaf0e8"
    stroke="#b8c7b5"
    stroke-width="4"
  />
  <text
    x="115"
    y="280"
    fill="#634b31"
    font-family="Arial,sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="2"
  >
    SIGNER
  </text>
  <rect
    x="130"
    y="320"
    width="510"
    height="105"
    rx="16"
    fill="#fff"
    stroke="#d9c2a8"
    stroke-width="3"
  />
  <text
    x="385"
    y="365"
    text-anchor="middle"
    fill="#49341f"
    font-family="Arial,sans-serif"
    font-size="27"
    font-weight="700"
  >
    Protected private signing key
  </text>
  <text
    x="385"
    y="402"
    text-anchor="middle"
    fill="#6d5942"
    font-family="Arial,sans-serif"
    font-size="23"
  >
    kept by authorized signer
  </text>
  <rect
    x="130"
    y="455"
    width="510"
    height="105"
    rx="16"
    fill="#fff"
    stroke="#d9c2a8"
    stroke-width="3"
  />
  <text
    x="385"
    y="500"
    text-anchor="middle"
    fill="#49341f"
    font-family="Arial,sans-serif"
    font-size="27"
    font-weight="700"
